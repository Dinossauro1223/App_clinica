<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NutriLab</title>
<style>
body{margin:0;padding:28px 20px;font:17px/1.45 sans-serif;background:#f3f6f2;color:#1d2a2a}
h1{margin:0 0 4px;font-size:2rem;color:#0f4c5c}
p{margin:8px 0}.mini{font-size:.9rem;color:#5d6b66}
input{width:100%;box-sizing:border-box;margin:8px 0 14px;padding:12px;font-size:1.1rem;border:1px solid #cfd8d3;border-radius:8px}
button{width:100%;padding:14px;font-size:1.1rem;font-weight:bold;color:#fff;background:#0f4c5c;border:0;border-radius:8px}
</style>
</head>
<body>
<h1>NutriLab</h1>
<p class="mini">Serviço de Nutrição: acesso da equipe</p>
<p>Digite o endereço do servidor, o computador do administrador. Ele aparece na janela do servidor, na linha <b>Celulares</b>, por exemplo <b>192.168.0.10:8765</b>.</p>
<input id="e" type="text" inputmode="url" autocapitalize="none" autocomplete="off" placeholder="192.168.0.10:8765">
<button onclick="ok()">Conectar</button>
<p class="mini">O celular precisa estar no mesmo Wi-Fi do computador.</p>
<script>
var a=window.Android;
if(a&&a.servidor()){document.getElementById('e').value=a.servidor().replace('http://','')}
function ok(){var v=document.getElementById('e').value.trim();if(!v){alert('Digite o endereço do servidor.');return}a.salvar(v)}
</script>
</body>
</html>
