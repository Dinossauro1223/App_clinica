<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NutriLab Mobile</title>
<style>
:root{--tinta:#1d2a2a;--papel:#f3f6f2;--cartao:#fff;--linha:#cfd8d3;--suave:#5d6b66;--cor:#0f4c5c;--alerta:#b3261e;--alerta-bg:#fde8e6}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--tinta);background:var(--papel)}
header{background:var(--cor);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header h1{margin:0;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
header .sub{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;opacity:.9}
header .sub button{background:none;border:1px solid #fff9;color:#fff;border-radius:6px;padding:4px 10px}
nav{display:flex;gap:2px;background:var(--cor);padding:0 10px;overflow-x:auto}
nav button{background:none;border:0;color:#fff;opacity:.65;padding:10px 12px;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{opacity:1;border-color:#fff}
main{max-width:600px;margin:0 auto;padding:12px 12px 100px}
body.adm main{max-width:1100px}
.grade{display:grid;gap:10px}
@media(min-width:900px){body.adm .grade{grid-template-columns:repeat(2,1fr)}}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:8px;padding:12px;margin-bottom:10px}
.grade .cartao{margin:0}
h2{font-size:1.1rem;margin:14px 0 8px}
.cod{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;margin-right:6px}
details.leito summary{cursor:pointer;list-style:none}
details.leito summary::-webkit-details-marker{display:none}
details.leito[open] summary{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--linha)}
.tg{margin-right:14px;white-space:nowrap}
.tg input{width:22px;height:22px;vertical-align:-5px;margin-right:4px;accent-color:var(--cor)}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--linha);border-radius:6px;background:#fff;font:inherit}
input[type=number]{font-variant-numeric:tabular-nums}
label.f{display:block;font-size:.85rem;color:var(--suave);margin-bottom:8px}
.filtros{display:flex;gap:10px;flex-wrap:wrap}.filtros label{flex:1;min-width:120px}
.btn{background:var(--cor);color:#fff;border:0;border-radius:6px;padding:12px 16px;font:inherit;font-weight:700;min-height:44px}
.btn:disabled{opacity:.45}
.btn.sec{background:#fff;color:var(--cor);border:1.5px solid var(--cor)}.btn.no{background:var(--alerta)}.btn.peq{padding:6px 12px;min-height:36px}
.chip{display:inline-block;font-size:.75rem;border-radius:10px;padding:1px 8px;background:#e6ece8;color:var(--suave);margin-right:4px}
.chip.adm{background:var(--cor);color:#fff}.chip.pen{background:var(--alerta-bg);color:var(--alerta);font-weight:700}
.barra{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--papel);border-top:1px solid var(--linha)}
.barra .btn{display:block;width:100%;max-width:600px;margin:0 auto}body.adm .barra .btn{max-width:1100px}
.aviso{padding:10px 12px;border-radius:8px;margin-bottom:10px;background:#e6ece8}.aviso.erro{background:var(--alerta-bg);color:var(--alerta);font-weight:600}
.alerta{border-left:5px solid var(--alerta)}
.nums{font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:800}
.mini{font-size:.85rem;color:var(--suave)}
.passo{display:flex;gap:6px}.passo .btn{padding:0 14px}
.seg label{display:block;padding:10px;border:1px solid var(--linha);border-radius:6px;margin-bottom:6px}
.seg input{margin-right:8px;accent-color:var(--cor)}.seg .off{opacity:.45}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.caixa{background:var(--papel);width:100%;max-width:520px;max-height:85vh;overflow:auto;padding:14px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom));border-radius:14px 14px 0 0}
.caixa ul{margin:6px 0 0;padding-left:18px}
#entrada{max-width:380px;margin:12vh auto;padding:0 16px}
#entrada h1{font-size:2rem;margin:0 0 4px}
.creditos{text-align:center;color:var(--suave);font-size:.78rem;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--linha);margin-top:12px}
.orientacao-texto{white-space:normal;line-height:1.55}
.orientacao-texto br{display:block;margin-bottom:5px;content:""}
.orientacao-nota{background:#edf3ef;border-left:4px solid var(--cor);border-radius:6px;padding:10px 12px;margin:8px 0}
.img-diluicao{display:block;width:100%;max-height:230px;object-fit:contain;margin:4px auto 10px}
.potassio-grafico{display:grid;gap:9px;margin:12px 0}
.potassio-linha{display:grid;grid-template-columns:minmax(105px,1fr) minmax(90px,2fr) 58px;align-items:center;gap:8px;font-size:.84rem}
.potassio-barra{height:13px;background:#e8eeea;border-radius:20px;overflow:hidden}
.potassio-barra span{display:block;height:100%;background:#347b70;border-radius:20px}
.potassio-valor{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.potassio-legenda{font-size:.8rem;color:var(--suave);line-height:1.5}
@media(max-width:360px){.potassio-linha{grid-template-columns:90px minmax(55px,1fr) 52px;gap:5px;font-size:.76rem}}
.passos-preparo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.passo-preparo{border:1px solid var(--linha);border-radius:8px;background:#fff;padding:9px;font-size:.82rem}
.passo-preparo b{display:block;margin-bottom:4px}
.frutas-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fruta-card{border:1px solid var(--linha);border-radius:8px;padding:9px;background:#fff;min-width:0}
.fruta-topo{display:flex;gap:8px;align-items:center;min-height:68px}
.fruta-topo b{font-size:.98rem}
.fruta-fig{display:block;width:64px;height:64px;flex:0 0 64px;background-image:url('/static/frutas.svg');background-size:300% 300%;background-repeat:no-repeat}
.f-melao{background-position:0% 0%}.f-melancia{background-position:50% 0%}.f-banana{background-position:100% 0%}
.f-maca{background-position:0% 50%}.f-uva{background-position:50% 50%}.f-abacaxi{background-position:100% 50%}
.f-abacate{background-position:0% 100%}.f-laranja{background-position:50% 100%}.f-mamao{background-position:100% 100%}
.fruta-dados{font-size:.8rem;line-height:1.45;margin-top:5px}
.escala{display:grid;gap:7px;margin:8px 0 16px}
.escala-linha{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;padding:7px 0;border-bottom:1px solid #e7ece8}
.escala-fruta{display:flex;align-items:center;gap:7px;min-width:0;font-size:.88rem}
.escala-fruta .fruta-fig{width:38px;height:38px;flex-basis:38px}
.escala-valor{font-weight:750;font-variant-numeric:tabular-nums;font-size:.86rem;white-space:nowrap}
.escala-trilho{grid-column:1/3;height:8px;background:#e9eeea;border-radius:20px;overflow:hidden}
.escala-trilho span{display:block;height:100%;background:var(--cor);border-radius:20px}
.editor-orientacao{border-top:1px solid var(--linha);padding-top:10px;margin-top:10px}
.editor-orientacao textarea{min-height:140px}
.orientacao-fonte{font-size:.78rem;color:var(--suave)}
@media(min-width:650px){.frutas-grade{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:360px){.passos-preparo{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Cache offline do APK: no Android os valores ficam cifrados no Android Keystore. */
(function(){
  const fetchOnline=window.fetch.bind(window);
  const read=k=>{try{if(window.Android&&Android.cacheGet)return Android.cacheGet(k)||''}catch(e){}try{return localStorage.getItem('nl:'+k)||''}catch(e){return ''}};
  const write=(k,v)=>{try{if(window.Android&&Android.cacheSet){Android.cacheSet(k,String(v));return}}catch(e){}try{localStorage.setItem('nl:'+k,String(v))}catch(e){}};
  const remove=k=>{try{if(window.Android&&Android.cacheRemove){Android.cacheRemove(k);return}}catch(e){}try{localStorage.removeItem('nl:'+k)}catch(e){}};
  const clearData=()=>{try{if(window.Android&&Android.cacheClear){Android.cacheClear();write('queue','[]');return}}catch(e){}try{Object.keys(localStorage).filter(k=>k.startsWith('nl:GET:')||k==='nl:queue').forEach(k=>localStorage.removeItem(k));write('queue','[]')}catch(e){}};
  const queue=()=>{try{return JSON.parse(read('queue')||'[]')}catch(e){return []}};
  const pathOf=u=>{try{const x=new URL(typeof u==='string'?u:u.url,location.href);return x.pathname+x.search}catch(e){return String(u)}};
  const jsonResponse=(obj,status=200)=>new Response(JSON.stringify(obj),{status,headers:{'Content-Type':'application/json; charset=utf-8'}});
  const snapshot=l=>JSON.stringify({
    nome:l.nome||'',idade_anos:l.idade_anos??null,idade_meses:l.idade_meses??null,acompanhante:!!l.acompanhante,cor:l.cor||'',dieta:l.dieta||'',diagnostico:l.diagnostico||'',pref_sim:l.pref_sim||'',pref_nao:l.pref_nao||'',
    consistencia:l.consistencia||'',via:l.via||'',dm:!!l.dm,has:!!l.has,laxativa:!!l.laxativa,
    constipante:!!l.constipante,drc:!!l.drc,
    suplementos:(l.suplementos||[]).map(s=>({id_suplemento:s.id_suplemento,nome:s.nome,ml_oferta:Number(s.ml_oferta||0),
      agua_ml:Number(s.agua_ml||0),refeicoes:s.refeicoes||[],qtd_dia:Number(s.qtd_dia||0),batido_fruta:!!s.batido_fruta}))
  });
  function guardarFila(path,body){
    const q=queue(),key=path+'|'+(body.setor||'')+'|'+(body.data||'');
    let base=null;
    if(path==='/api/mapa'){
      const url=`/api/mapa?setor=${encodeURIComponent(body.setor||'')}&data=${encodeURIComponent(body.data||'')}`;
      try{const old=JSON.parse(read('GET:'+url)||'{}');base={};for(const l of body.linhas||[]){const prev=(old.linhas||[]).find(x=>String(x.id_leito)===String(l.id_leito));if(prev)base[l.id_leito]=prev}}catch(e){}
    }
    const user=read('user');
    let userId=null;try{userId=JSON.parse(user||'{}').usuario?.id||null}catch(e){}
    const entry={path,body,base,userId,criado_em:new Date().toISOString()};
    const ix=path==='/api/mapa'?q.findIndex(x=>x.path===path&&x.body.setor===body.setor&&x.body.data===body.data):-1;
    if(ix>=0){entry.base=q[ix].base;entry.userId=q[ix].userId;q[ix]=entry}else q.push(entry);
    write('queue',JSON.stringify(q));
    if(path==='/api/mapa'){
      const url=`/api/mapa?setor=${encodeURIComponent(body.setor||'')}&data=${encodeURIComponent(body.data||'')}`;
      try{
        const old=JSON.parse(read('GET:'+url)||'{}');
        for(const line of body.linhas||[]){
          const row=(old.linhas||[]).find(x=>String(x.id_leito)===String(line.id_leito));
          if(!row)continue;
          const sups=(line.suplementos||[]).map(s=>{const refs=s.refeicoes||[],ml=Number(s.ml_oferta||0);return {...s,ml_oferta:ml,agua_ml:Number(s.agua_ml||0),ofertas_dia:refs.length,qtd_dia:ml*refs.length,unidade:'ml'}});
          Object.assign(row,line,{ocupado:line.nome?1:0,suplementos:sups,suplementos_json:JSON.stringify(sups),
            data_base:body.data,herdado:false,rascunho:!!(window.NL&&window.NL.isStaff&&window.NL.isStaff())});
        }
        write('GET:'+url,JSON.stringify(old));
      }catch(e){}
    }
  }
  window.fetch=async function(input,init){
    init=init||{};
    const method=String(init.method||(input&&input.method)||'GET').toUpperCase(),path=pathOf(input);
    if(!path.startsWith('/api/'))return fetchOnline(input,init);
    if(method==='GET'){
      try{
        const response=await fetchOnline(input,init);
        if(response.ok){const body=await response.clone().text();write('GET:'+path,body)}
        return response;
      }catch(err){
        let raw=read('GET:'+path);
        if(path==='/api/eu'&&!raw){raw=read('user');if(raw){try{const u=JSON.parse(raw);raw=JSON.stringify({usuario:u.usuario,hoje:u.hoje})}catch(e){raw=''}}}
        if(!raw)throw err;
        try{const obj=JSON.parse(raw);obj.__offline=true;return jsonResponse(obj)}catch(e){throw err}
      }
    }
    if(method==='POST'){
      try{return await fetchOnline(input,init)}
      catch(err){
        if(path==='/api/login')throw err;
        let body={};try{body=JSON.parse(init.body||'{}')}catch(e){}
        guardarFila(path,body);
        return jsonResponse({ok:true,offline:true,queued:true});
      }
    }
    return fetchOnline(input,init);
  };

  let adiado=false,modal=null;
  async function servidorAcessivel(){
    try{
      const token=window.NL&&window.NL.token?window.NL.token():'';
      const r=await fetchOnline('/api/eu',{headers:token?{Authorization:'Bearer '+token}:{}});
      return r.status===200||r.status===401;
    }catch(e){return false}
  }
  async function conflitos(q){
    let total=0,cache={};
    for(const item of q){
      if(item.path!=='/api/mapa'||!item.base)continue;
      const key=String(item.body.setor)+'|'+String(item.body.data);
      if(!cache[key]){
        try{
          const token=window.NL&&window.NL.token?window.NL.token():'';
          const url=`/api/mapa?setor=${encodeURIComponent(item.body.setor||'')}&data=${encodeURIComponent(item.body.data||'')}`;
          const r=await fetchOnline(url,{headers:token?{Authorization:'Bearer '+token}:{}});
          if(!r.ok)continue;cache[key]=await r.json();
        }catch(e){continue}
      }
      const linhas=cache[key].linhas||[];
      for(const id of Object.keys(item.base)){
        const atual=linhas.find(l=>String(l.id_leito)===String(id));
        if(!atual||snapshot(atual)!==snapshot(item.base[id]))total++;
      }
    }
    return total;
  }
  function fechar(){if(modal){modal.remove();modal=null}}
  function mostrar(q,nConflitos){
    fechar();
    modal=document.createElement('div');modal.className='modal';
    modal.style.cssText='position:fixed;inset:0;z-index:99999;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px';
    const texto=nConflitos?`${nConflitos} leito(s) também foram alterados no servidor desde a última cópia local. Confira as diferenças antes de enviar. O servidor continuará aplicando suas regras de autorização.`:
      'Há alterações feitas sem conexão que ainda não foram enviadas ao servidor.';
    modal.innerHTML=`<div class=caixa style="max-width:520px;width:100%;background:white;padding:20px;border-radius:12px">
      <h2 style="margin-top:0">Sincronização pendente</h2><p>${texto}</p><p class=mini>${q.length} operação(ões) aguardando envio.</p>
      <button class=btn id=nl-enviar style="width:100%;margin:5px 0">Enviar atualizações</button>
      <button class="btn sec" id=nl-adiar style="width:100%;margin:5px 0">Adiar até o próximo acesso ao servidor</button>
      <button class="btn no" id=nl-reverter style="width:100%;margin:5px 0">Reverter cópia local para a versão do servidor</button>
      <p class=mini id=nl-sync-msg></p></div>`;
    document.body.appendChild(modal);
    modal.querySelector('#nl-adiar').onclick=()=>{adiado=true;fechar()};
    modal.querySelector('#nl-enviar').onclick=async()=>{
      const botao=modal.querySelector('#nl-enviar'),msg=modal.querySelector('#nl-sync-msg');
      botao.disabled=true;msg.textContent='Enviando...';
      try{
        const atual=queue(),token=window.NL&&window.NL.token?window.NL.token():'',uid=window.NL&&window.NL.userId?window.NL.userId():null;
        if(atual.some(x=>x.userId&&uid&&x.userId!==uid))throw new Error('As alterações pendentes pertencem a outro usuário. Entre com a conta que as criou.');
        for(let i=0;i<atual.length;i++){
          const item=atual[i];
          const r=await fetchOnline(item.path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(item.body)});
          if(r.status===401){fechar();if(window.NL&&window.NL.expired)window.NL.expired();return}
          const j=await r.json().catch(()=>({}));
          if(!r.ok)throw new Error(j.erro||'O servidor recusou uma atualização.');
          atual.splice(i,1);i--;write('queue',JSON.stringify(atual));
        }
        fechar();
        if(window.NL&&window.NL.refresh)await window.NL.refresh();
        if(window.NL&&window.NL.aviso)window.NL.aviso('Atualizações offline enviadas ao servidor.',false);
      }catch(e){msg.textContent=e.message;botao.disabled=false}
    };
    modal.querySelector('#nl-reverter').onclick=async()=>{
      if(!confirm('Descartar todas as alterações locais pendentes e carregar novamente os dados do servidor?'))return;
      write('queue','[]');clearData();fechar();
      try{if(window.NL&&window.NL.refresh)await window.NL.refresh()}catch(e){}
      if(window.NL&&window.NL.aviso)window.NL.aviso('Cópia local descartada. Os dados serão carregados do servidor.',false);
    };
  }
  async function ready(){
    const q=queue();
    if(!q.length||adiado||modal)return;
    if(!(await servidorAcessivel()))return;
    const n=await conflitos(q);mostrar(q,n);
  }
  window.NLOffline={get:read,set:write,remove,clearData,ready,pendentes:()=>queue().length};
  window.addEventListener('online',()=>{adiado=false;setTimeout(ready,500)});
  document.addEventListener('DOMContentLoaded',()=>setTimeout(ready,800));
})();
</script>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),v=x=>x==null?'':x;
const S={tok:null,u:null,hoje:'',aba:'',setor:'',est:'almox',data:'',setores:[],itens:[],suplementos:[],timer:null};
try{S.tok=(window.NLOffline&&NLOffline.get('token'))||sessionStorage.getItem('tok')}catch(e){}
const NOME={admin:'Administrador',nutricionista:'Nutrição',copa:'Copa',estoque_cozinha:'Cozinha',estoque_almox:'Almoxarifado'};
const COR={admin:'#0f4c5c',nutricionista:'#2f7d4f',copa:'#a85f00',estoque_cozinha:'#b5391f',estoque_almox:'#4b3f8f'};
const REF={desjejum:'Desjejum',colacao:'Lanche da manhã',almoco:'Almoço',lanche:'Lanche da tarde',jantar:'Jantar',ceia:'Ceia'};
const ORI={externo:'Entrada de fornecedor/compra',almox:'Almoxarifado',cozinha:'Cozinha'};
const LB={nome:'paciente',idade_anos:'idade (anos)',idade_meses:'meses',dieta:'dieta',diagnostico:'diagnóstico',pref_sim:'gosta',pref_nao:'não aceita',acompanhante:'acompanhante'};
const ABAS={admin:[['painel','Painel'],['mapa','Mapa'],['refeicoes','Refeições'],['estoque','Estoques'],['avisos','Avisos'],['cadastros','Cadastros'],['orientacoes','Orientações']],
 nutricionista:[['painel','Painel'],['mapa','Mapa'],['refeicoes','Refeições'],['avisos','Avisos'],['orientacoes','Orientações']],
 copa:[['mapa','Mapa'],['refeicoes','Refeições'],['estoque','Estoque'],['orientacoes','Orientações']],
 estoque_cozinha:[['estoque','Estoque'],['orientacoes','Orientações']],estoque_almox:[['estoque','Estoque'],['orientacoes','Orientações']]};
const ehStaff=()=>S.u.perfil==='admin'||S.u.perfil==='nutricionista';
const escolheSetor=()=>S.u.perfil==='admin'||((S.u.perfil==='nutricionista'||S.u.perfil==='copa')&&!S.u.id_setor);
const br=i=>i?i.slice(8,10)+'/'+i.slice(5,7):'';
async function api(p,b){
  const r=await fetch(p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',...(S.tok?{Authorization:'Bearer '+S.tok}:{})},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({erro:'Resposta inválida do servidor.'}));
  if(r.status===401&&S.tok){sair();throw new Error(j.erro)}
  if(!r.ok)throw new Error(j.erro||'Erro');
  return j;
}
function aviso(t,erro){const a=$('#aviso');if(a){a.innerHTML=t?`<div class="aviso ${erro?'erro':''}">${esc(t)}</div>`:'';if(t)scrollTo(0,0)}}
const tenta=f=>async(...a)=>{try{await f(...a)}catch(e){aviso(e.message,1)}};
function sair(){clearInterval(S.timer);S.tok=null;S.u=null;try{sessionStorage.removeItem('tok');if(window.NLOffline){NLOffline.remove('token');NLOffline.remove('user')}}catch(e){}telaLogin()}
function telaLogin(msg){
  document.documentElement.style.setProperty('--cor','#0f4c5c');document.body.className='';
  $('#app').innerHTML=`<div id=entrada><h1>NutriLab</h1><p class=mini>Serviço de Nutrição — acesso da equipe</p>${msg?`<div class="aviso erro">${esc(msg)}</div>`:''}
  <label class=f>Login<input type=text id=lg autocapitalize=none autocomplete=username></label>
  <label class=f>Senha<input type=password id=sn autocomplete=current-password></label>

  '<p class=orientacao-fonte>Composição nutricional: <a href="https://www.tbca.net.br/base-dados/" target="_blank" rel="noopener">TBCA/USP</a>. Os valores do gráfico abaixo são por 100 g da parte comestível.</p></div>' +
  '<div class=cartao><h2 style="margin-top:0">Potássio nas frutas</h2><p class=mini>Comparação em miligramas (mg) por 100 g, alimento in natura.</p>' +
  '<div class=potassio-grafico role=img aria-label="Gráfico de potássio por 100 gramas: maçã Fuji 74,71; melancia 83,62; mamão papaia 124,84; abacaxi 137,51; uva 160,42; laranja pera 158,12; melão 173; abacate 174,21; banana média 346 miligramas.">' +
  FRUTAS.slice().sort((a,b)=>a.potassio-b.potassio).map(f=>'<div class=potassio-linha><span>'+esc(f.nome)+'</span><div class=potassio-barra><span style="width:'+Math.max(2,(f.potassio/360)*100)+'%"></span></div><span class=potassio-valor>'+f.potassio.toFixed(1).replace('.',',')+'</span></div>').join('') +
  '</div><p class=potassio-legenda><b>Como ler:</b> quanto menor a barra, menor o potássio por 100 g nesta comparação. Maçã e melancia aparecem entre os menores valores; banana apresenta valor bem mais alto. Uva fica em faixa intermediária — não é “neutra” nem isenta de potássio.</p>' +
  '<p class=potassio-legenda><b>Importante para doença renal:</b> este gráfico não libera nem proíbe alimentos. A quantidade permitida depende dos exames, da função renal, dos medicamentos, da porção e do plano individual. Confirme a escolha com a Nutrição.</p>' +
  '<p class=orientacao-fonte>Fontes TBCA/USP: maçã Fuji (busca por componente); melancia BRC0027C; mamão Papaia BRC0044C; abacaxi BRC0002C; uva BRC0033C; laranja Pera BRC0020C; melão BRC0028C; abacate BRC0001C; banana média BRC0006C. <a href="https://www.tbca.net.br/base-dados/busca_componente.php?cmb_grupo=67&amp;cmb_tipo_alimento=65&amp;componente=mg%7CPOT%C3%81SSIO" target="_blank" rel="noopener">Consultar busca oficial de potássio na TBCA</a>.</p></div>';
 const editor=S.u.perfil==='admin'&&os.length ? '<div class=cartao><h2 style="margin-top:0">Editor de orientações</h2><p class=mini>Edite os textos abaixo ou acrescente um tópico. As alterações ficam salvas para todos os celulares.</p>' +
  os.map(o=>'<div class=editor-orientacao data-oid=' + o.id + '><label class=f>Título<input type=text class=otitulo maxlength=120 value="' + esc(o.titulo) + '"></label>' +
  '<label class=f>Texto<textarea class=otexto maxlength=8000 rows=5>' + esc(o.texto) + '</textarea></label>' +
  '<button class="btn sec peq" onclick="salvaOrientacao(' + o.id + ',this)">Salvar texto</button></div>').join('') +
  '<div class=editor-orientacao><h3>Novo tópico</h3><label class=f>Título<input id=novoOtitulo type=text maxlength=120></label>' +
  '<label class=f>Texto<textarea id=novoOtexto rows=5 maxlength=8000 placeholder="Digite a orientação adicional"></textarea></label>' +
  '<button class=btn onclick="novaOrientacao()">Adicionar tópico</button></div></div>' : '';
 $('#vista').innerHTML=editor+dil+'<h2>Frutas: intestino, potássio e diabetes</h2>' + textoOrientacao(by.intestino) +
  '<div class=orientacao-nota><b>Importante:</b> não existe uma classificação universal de frutas constipantes. A resposta depende da porção, variedade, maturação, preparo, hidratação, tolerância e condição clínica. Em dietas com restrição de fibras, potássio ou carboidratos, siga a prescrição e consulte a ficha exata do alimento na TBCA/USP; não faça substituições por iniciativa própria.</div>' +
  cards + textoOrientacao(by.potassio) + textoOrientacao(by.diabetes) + os.filter(o=>o.slug.startsWith('extra-')).map(textoOrientacao).join('');
}
const salvaOrientacao=tenta(async(id,b)=>{
 const e=b.closest('[data-oid]');
 await api('/api/admin/orientacoes',{id,titulo:e.querySelector('.otitulo').value,texto:e.querySelector('.otexto').value});
 await vOrientacoes();aviso('Orientação atualizada.',0);
});
const novaOrientacao=tenta(async()=>{
 await api('/api/admin/orientacoes',{titulo:$('#novoOtitulo').value,texto:$('#novoOtexto').value});
 await vOrientacoes();aviso('Novo tópico adicionado.',0);
});

/* ---------- Painel (admin e nutrição) ---------- */
function dif(a,b){
  if('qtd' in b)return 'Valor atual: '+v(a.qtd)+' → pedido: '+v(b.qtd);
  const d=Object.keys(LB).filter(k=>v(a[k])!==v(b[k])).map(k=>LB[k]+': '+(v(a[k])===''?'—':v(a[k]))+' → '+(v(b[k])===''?'—':v(b[k])));
  return d.join(' · ')||'Sem diferença.';
}
async function vPainel(){
  const [p,c]=await Promise.all([api('/api/nutri/painel?data='+S.data),api('/api/nutri/correcoes')]);
  $('#vista').innerHTML=filtros('')+(c.correcoes.length?`<h2>Correções aguardando autorização (${c.correcoes.length})</h2><div class=grade>`+c.correcoes.map(k=>`<div class="cartao alerta"><b>${esc(k.rotulo)}</b> <span class=mini>${br(k.data)} · pedido de ${esc(k.usuario)}</span>
   <p>${esc(dif(k.valor_atual,k.valor_proposto))}</p>
   <button class="btn peq" onclick="decide(${k.id},'aprovar')">Aprovar</button> <button class="btn peq no" onclick="decide(${k.id},'recusar')">Recusar</button></div>`).join('')+'</div>':'<div class=cartao>Nenhuma correção pendente.</div>')+
  (p.divergencias?`<div class="aviso erro">${p.divergencias} reposição(ões) de hoje com saldo insuficiente na origem: confira a contagem do estoque de origem.</div>`:'')+
  '<h2>Setores</h2><div class=grade>'+p.setores.map(s=>`<div class=cartao><b>${esc(s.nome)}</b><div class=nums>${s.ocupados}<span class=mini> / ${s.leitos} leitos ocupados</span></div>
   <div class=mini>Mapa: ${s.mapa_atualizado?'atualizado':'sem atualização neste dia'}${s.rascunhos?` · <b>${s.rascunhos} leito(s) em rascunho, não publicados</b>`:''} · Refeições contadas: ${s.refeicoes}</div></div>`).join('')+'</div>'+
  (p.estoques.length?'<h2>Estoques</h2><div class=grade>'+p.estoques.map(e=>`<div class=cartao><b>${NOME[e.estoque==='almox'?'estoque_almox':e.estoque==='cozinha'?'estoque_cozinha':'copa']}</b><div class=nums>${e.atualizados}<span class=mini> / ${e.itens} itens atualizados</span></div>
   <div class=mini>${e.ultima?'Última atualização: '+esc(e.ultima.slice(11,16)):'Sem atualização neste dia'}</div></div>`).join('')+'</div>':'');
}
const decide=tenta(async(id,acao)=>{await api('/api/nutri/correcoes/'+id,{acao});await vPainel();aviso(acao==='aprovar'?'Correção aprovada e aplicada.':'Correção recusada.',0)});
/* ---------- Avisos (nutrição envia; copa recebe em popup) ---------- */
function vAvisos(){
  $('#vista').innerHTML=`<div class=cartao><h2 style="margin-top:0">Aviso para a copa</h2><p class=mini>Aparece como popup quando a copeira abre o app (e a cada minuto enquanto ele está aberto). Para avisar sobre leitos alterados, use "Salvar e publicar" na aba Mapa.</p>
  ${escolheSetor()?`<label class=f>Para<select id=as><option value="">Todos os setores</option>${S.setores.map(s=>`<option value=${s.id}>${esc(s.nome)}</option>`).join('')}</select></label>`:''}
  <label class=f>Mensagem<textarea id=at rows=4 maxlength=500 placeholder="Ex.: Dieta zero a partir das 20h no leito A03"></textarea></label><button class=btn onclick="enviaAviso()">Enviar aviso</button></div>`;
}
const enviaAviso=tenta(async()=>{await api('/api/nutri/avisos',{texto:$('#at').value,id_setor:$('#as')?(+$('#as').value||null):null});$('#at').value='';aviso('Aviso enviado.',0)});
function popup(avs){
  const L={nome:'paciente',idade_anos:'idade',idade_meses:'idade',dieta:'dieta',diagnostico:'diagnóstico',pref_sim:'preferências',pref_nao:'preferências',acompanhante:'acompanhante',cor:'cor',consistencia:'consistência',via:'via',dm:'características da dieta',has:'características da dieta',laxativa:'características da dieta',constipante:'características da dieta',drc:'características da dieta',suplementos_json:'suplementação'},T={novo:'novo paciente',liberado:'leito liberado',alterado:'alterado'};
  const h=avs.map(a=>`<div class=cartao><b>${esc(a.titulo)}</b> <span class=mini>${esc(a.criado_em.slice(8,10)+'/'+a.criado_em.slice(5,7)+' '+a.criado_em.slice(11,16))} · ${esc(a.por_nome)}</span>
   ${a.texto?`<p>${esc(a.texto)}</p>`:''}${a.leitos.length?'<ul>'+a.leitos.map(x=>`<li><b>${esc(x.leito)}</b>: ${T[x.tipo]}${x.tipo==='alterado'?' ('+[...new Set(x.campos.map(k=>L[k]))].join(', ')+')':''}</li>`).join('')+'</ul>':''}</div>`).join('');
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class=caixa><h2 style="margin-top:0">Avisos da nutrição</h2>${h}<button class=btn style="width:100%" id=ok>Entendi</button></div>`;
  document.body.appendChild(m);
  $('#ok').onclick=tenta(async()=>{await api('/api/avisos/lidos',{ids:avs.map(a=>a.id)});m.remove();if(S.aba==='mapa')ir('mapa')});
  try{if(navigator.vibrate)navigator.vibrate(200)}catch(e){}
  try{if(window.Notification&&Notification.permission==='granted')new Notification('NutriLab: '+avs.length+' aviso(s) da nutrição')}catch(e){}
}
async function verAvisos(){
  if(!S.u||S.u.perfil!=='copa'||document.hidden||$('.modal'))return;
  try{const j=await api('/api/avisos');if(j.avisos.length)popup(j.avisos)}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)verAvisos()});
/* ---------- Cadastros (admin) ---------- */
async function vCad(){
  const [u,r]=await Promise.all([api('/api/admin/usuarios'),api('/api/admin/refeicoes')]);
  const opSet=(sel,vazio)=>`<option value="">${vazio}</option>`+S.setores.map(s=>`<option value=${s.id} ${s.id===sel?'selected':''}>${esc(s.nome)}</option>`).join('');
  $('#vista').innerHTML=`<div class=grade><div class=cartao><h2 style="margin-top:0">Novo usuário</h2>
  <label class=f>Login<input type=text id=nl autocapitalize=none></label><label class=f>Nome<input type=text id=nn></label>
  <label class=f>Perfil<select id=np onchange="$('#ns').parentNode.style.display=(this.value==='copa'||this.value==='nutricionista')?'block':'none'">${Object.keys(NOME).map(k=>`<option value=${k}>${NOME[k]}${k==='copa'?' (copeira: mapa compartilhado, refeições e estoque da copa)':k==='nutricionista'?' (publica mapa, avisos, horários)':''}</option>`).join('')}</select></label>
  <label class=f style="display:none">Setor (vazio = acesso a todos os setores para nutrição e copa)<select id=ns>${opSet(null,'— nenhum / todos —')}</select></label>
  <label class=f>Senha inicial (mín. 6)<input type=text id=nx></label><button class=btn onclick="novoUsuario()">Criar usuário</button></div>
  <div class=cartao><h2 style="margin-top:0">Usuários</h2>${u.usuarios.map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--linha)"><b>${esc(x.nome)}</b> <span class=mini>${esc(x.login)} · ${NOME[x.perfil]}${x.ativo?'':' · desativado'}</span><br>
   ${x.perfil==='copa'||x.perfil==='nutricionista'?`<select onchange="trocaSetor(${x.id},this.value)" style="width:auto;min-height:36px">${opSet(x.id_setor,x.perfil==='copa'?'todos os setores (mapa compartilhado)':'todos os setores')}</select> `:''}
   <button class="btn sec peq" onclick="ativa(${x.id},${x.ativo?0:1})">${x.ativo?'Desativar':'Reativar'}</button> <button class="btn sec peq" onclick="senha(${x.id})">Nova senha</button></div>`).join('')}</div>
  <div class=cartao><h2 style="margin-top:0">Refeições contadas</h2><p class=mini>Habilite outras refeições quando quiser. O horário vale para todos os setores; a nutrição de cada setor pode ajustar o do seu.</p>
  ${r.refeicoes.map(x=>`<div data-cf=${x.refeicao} style="margin-bottom:8px"><label class=tg><input type=checkbox class=ca ${x.ativa?'checked':''}><b>${REF[x.refeicao]}</b></label>
   <div class=filtros><label class=f>Abre<input type=time class=cb value="${v(x.abre)}"></label><label class=f>Fecha<input type=time class=cc value="${v(x.fecha)}"></label></div></div>`).join('')}
  <button class=btn onclick="salvaCfg()">Salvar refeições</button></div>
  <div class=cartao><h2 style="margin-top:0">Setor e leitos</h2><label class=f>Setor<select id=ss>${opSet(null,'— novo setor —')}</select></label>
  <label class=f>Nome do novo setor<input type=text id=sn2></label><label class=f>Prefixo dos leitos (ex.: A)<input type=text id=sp></label>
  <div class=filtros><label class=f>De<input type=number id=si value=1></label><label class=f>Até<input type=number id=sf></label></div><button class=btn onclick="novoSetor()">Salvar setor/leitos</button></div>
  <div class=cartao><h2 style="margin-top:0">Itens do almoxarifado</h2>
  <label class=f>Nome do produto<input type=text id=in></label>
  <label class=f>Unidade de estoque (ex.: pacote, frasco ou lata)<input type=text id=iu placeholder="Ex.: pacote"></label>
  <div class=filtros><label class=f>Preço unitário (R$)<input type=number id=ip min=0 step=0.01 placeholder="Ex.: 8,50"></label>
  <label class=f>Conteúdo por embalagem<input type=number id=ie min=0.000001 step=any placeholder="Ex.: 500"></label></div>
  <div class=f><b>Unidade do conteúdo</b><div class=seg id=unidadeConteudo>
   <label><input type=radio name=ieu value="g" checked> Gramas (g)</label>
   <label><input type=radio name=ieu value="ml"> Mililitros (mL)</label>
   <label><input type=radio name=ieu value="un"> Unidade (un)</label>
  </div></div>
  <p class=mini>Informe o conteúdo de cada pacote/frasco e, separadamente, quantas embalagens existem no estoque, na tela Estoque. Para massa use g; para volume use mL. O programa converte automaticamente kg para g e L para mL em cadastros antigos ou importados.</p>
  <button class=btn id=btnSalvarItem onclick="novoItem()">Adicionar item</button>
  <h3>Itens cadastrados (${S.itens.length})</h3>
  ${S.itens.map(i=>`<div style="padding:7px 0;border-bottom:1px solid var(--linha)"><b>${esc(i.nome)}</b>
   <span class=mini>${esc(i.unidade)} · ${i.preco_unitario==null?'preço pendente':'R$ '+Number(i.preco_unitario).toFixed(2)} · ${i.embalagem_qtd==null?'conteúdo pendente':esc(i.embalagem_qtd+' '+i.embalagem_un)}</span>
   <button class="btn sec peq" onclick="editarItem(${i.id})">Editar preço/embalagem</button></div>`).join('')}
  </div></div>`;
}
const novoUsuario=tenta(async()=>{await api('/api/admin/usuarios',{login:$('#nl').value,nome:$('#nn').value,perfil:$('#np').value,id_setor:+$('#ns').value||null,senha:$('#nx').value});await vCad();aviso('Usuário criado.',0)});
const ativa=tenta(async(id,a)=>{await api('/api/admin/usuarios/'+id,{ativo:a});await vCad()});
const trocaSetor=tenta(async(id,s)=>{await api('/api/admin/usuarios/'+id,{id_setor:+s||null});aviso('Setor do usuário atualizado.',0)});
const senha=tenta(async id=>{const s=prompt('Nova senha (mín. 6 caracteres):');if(s){await api('/api/admin/usuarios/'+id,{senha:s});aviso('Senha alterada.',0)}});
const salvaCfg=tenta(async()=>{
  for(const e of document.querySelectorAll('[data-cf]'))await api('/api/admin/refeicoes',{refeicao:e.dataset.cf,ativa:e.querySelector('.ca').checked,abre:e.querySelector('.cb').value,fecha:e.querySelector('.cc').value});
  await vCad();aviso('Refeições salvas.',0);
});
async function recarregaBase(){S.setores=(await api('/api/setores')).setores;S.setor=S.setor||(S.setores[0]||{}).id||'';S.itens=(await api('/api/itens')).itens}
const novoSetor=tenta(async()=>{await api('/api/admin/setores',{id_setor:$('#ss').value,nome:$('#sn2').value,prefixo:$('#sp').value,inicio:+$('#si').value||1,fim:+$('#sf').value||0});await recarregaBase();await vCad();aviso('Setor/leitos salvos.',0)});
function editarItem(id){
 const item=S.itens.find(x=>String(x.id)===String(id));if(!item)return;
 S.itemEditando=id;
 $('#in').value=item.nome;$('#iu').value=item.unidade;
 $('#ip').value=item.preco_unitario??'';$('#ie').value=item.embalagem_qtd??'';
 document.querySelectorAll('input[name=ieu]').forEach(r=>{r.checked=r.value===(item.embalagem_un||'g')});
 $('#btnSalvarItem').textContent='Salvar alterações do item';
 $('#in').scrollIntoView({behavior:'smooth',block:'center'});
}
const novoItem=tenta(async()=>{
 const unidadeConteudo=document.querySelector('input[name=ieu]:checked');
 const corpo={nome:$('#in').value,unidade:$('#iu').value,preco_unitario:$('#ip').value,
  embalagem_qtd:$('#ie').value,embalagem_un:unidadeConteudo?unidadeConteudo.value:'g'};
 if(S.itemEditando)await api('/api/admin/itens/'+S.itemEditando,corpo);
 else await api('/api/admin/itens',corpo);
 S.itemEditando=null;await recarregaBase();await vCad();aviso('Item salvo.',0);
});
(async()=>{
  // Sem token salvo, a tela de login é o estado inicial normal: não consultar /api/eu.
  if(!S.tok){telaLogin();return}
  try{
    const j=await api('/api/eu');
    if(j.usuario)return await abrir(j.usuario,j.hoje);
    throw new Error('Resposta de sessão inválida.');
  }catch(e){
    const msg=String(e&&e.message||e);
    if(/Failed to fetch|NetworkError|Load failed|fetch/i.test(msg)){
      telaLogin('Não foi possível conectar ao servidor. Confira se o computador está ligado, no mesmo Wi-Fi e com o servidor NutriLab ativo.');
    }else{
      S.tok=null;
      try{if(window.NLOffline){NLOffline.remove('token');NLOffline.remove('user')}sessionStorage.removeItem('tok')}catch(_e){}
      telaLogin('Sua sessão expirou. Entre novamente para continuar.');
    }
  }
})();
window.NL={token:()=>S.tok,userId:()=>S.u&&S.u.id,isStaff:()=>ehStaff(),refresh:()=>ir('mapa'),
  aviso:(t,erro)=>aviso(t,erro),expired:()=>{sair();telaLogin('Sessão expirada. Entre novamente para sincronizar as alterações pendentes.')}};
</script>
