name: Build and publish NutriLab Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Read version
        id: version
        shell: bash
        run: |
          source mobile/version.properties
          echo "name=$versionName" >> "$GITHUB_OUTPUT"
          echo "code=$versionCode" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Configure ANDROID_KEYSTORE_BASE64 and the signing password/alias secrets." && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nutrilab-release.jks"

      - name: Build APK
        env:
          KS: ${{ runner.temp }}/nutrilab-release.jks
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VNAME: ${{ steps.version.outputs.name }}
          VCODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          BT="$SDK/build-tools/34.0.0"
          WORK="$RUNNER_TEMP/nutrilab-apk"
          mkdir -p "$WORK/obj/classes" "$WORK/obj/dex" "$WORK/app"
          cp -R mobile/apk/app/. "$WORK/app/"
          cp mobile/static/index.html "$WORK/app/assets/index.html"
          cp mobile/static/jsQR.js "$WORK/app/assets/jsQR.js"
          "$BT/aapt2" compile --dir "$WORK/app/res" -o "$WORK/obj/res.zip"
          "$BT/aapt2" link -o "$WORK/obj/base.apk" -I "$SDK/platforms/android-34/android.jar" \
            --manifest "$WORK/app/AndroidManifest.xml" -A "$WORK/app/assets" \
            --min-sdk-version 26 --target-sdk-version 34 --version-code "$VCODE" \
            --version-name "$VNAME" "$WORK/obj/res.zip"
          ZXING="$WORK/zxing-core-3.5.4.jar"
          curl -fsSL "https://maven-central.storage-download.googleapis.com/maven2/com/google/zxing/core/3.5.4/core-3.5.4.jar" -o "$ZXING"
          test -s "$ZXING"
          test "$(stat -c%s "$ZXING")" -gt 500000
          javac -encoding UTF-8 --release 8 -classpath "$SDK/platforms/android-34/android.jar:$ZXING" \
            -d "$WORK/obj/classes" "$WORK/app/src/br/nutrilab/mobile/MainActivity.java" \
            "$WORK/app/src/br/nutrilab/mobile/QRScannerActivity.java"
          jar cf "$WORK/obj/classes.jar" -C "$WORK/obj/classes" .
          "$BT/d8" --lib "$SDK/platforms/android-34/android.jar" --min-api 26 \
            --output "$WORK/obj/dex" "$WORK/obj/classes.jar" "$ZXING"
          (cd "$WORK/obj/dex" && "$BT/aapt" add "$WORK/obj/base.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$WORK/obj/base.apk" "$WORK/obj/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --ks-key-alias "$KS_ALIAS" --out "$WORK/NutriLab-Mobile.apk" "$WORK/obj/aligned.apk"
          "$BT/apksigner" verify --verbose "$WORK/NutriLab-Mobile.apk"
          mkdir -p dist
          cp "$WORK/NutriLab-Mobile.apk" dist/NutriLab-Mobile.apk
          sha256sum dist/NutriLab-Mobile.apk > dist/SHA256SUMS.txt
          cp mobile/version.properties dist/mobile-version.properties

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: NutriLab v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            dist/NutriLab-Mobile.apk
            dist/SHA256SUMS.txt
            dist/mobile-version.properties
