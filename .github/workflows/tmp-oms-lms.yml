name: Temporary WHO LMS extraction
on:
  push:
    branches: [tmp/oms-lms-extract]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Extract WHO reference tables
        run: |
          Rscript -e 'install.packages("base64enc", repos="https://cloud.r-project.org")'
          Rscript tools/exportar_oms_lms.R
      - uses: actions/upload-artifact@v4
        with:
          name: who-lms-reference-data
          path: tmp/oms-lms/*.csv
          if-no-files-found: error
          retention-days: 1
