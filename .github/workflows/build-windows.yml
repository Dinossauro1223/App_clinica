name: Build Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-assets:
    name: Gerar identidade visual (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar renderizador SVG independente de bibliotecas do sistema
        run: |
          python -m pip install --upgrade pip
          python -m pip install "resvg_py==0.5.0" "Pillow>=10,<13"

      - name: Testes prioritários — renderizador e identidade visual
        run: python -m unittest discover -s tests -p "test_svg_pipeline.py" -v

      - name: Disponibilizar arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: identidade-visual-gerada
          path: |
            assets/identidade/nutrilab_identidade.png
            assets/identidade/nutrilab_icone.png
            assets/identidade/nutrilab.ico
            assets/identidade/renderizados/
          if-no-files-found: error

  build:
    name: Build NutriLab para Windows
    needs: generate-assets
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Baixar o código (histórico completo para auditoria)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Instalar dependências de compilação
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Testes prioritários — renderizador e identidade visual no Windows
        run: python -m unittest discover -s tests -p "test_svg_pipeline.py" -v

      - name: Auditar privacidade antes da compilação
        run: python tools/auditar_repositorio.py --ci

      - name: Baixar identidade visual gerada
        uses: actions/download-artifact@v4
        with:
          name: identidade-visual-gerada
          path: assets/identidade

      - name: Gerar banco inicial vazio e sanitizado
        run: python tools/gerar_banco_modelo.py

      - name: Compilar NutriLab.exe
        run: python -m PyInstaller --clean --noconfirm app_clinica.spec

      - name: Verificar pacote compilado
        shell: pwsh
        run: |
          $exe = "dist/NutriLab/NutriLab.exe"
          if (!(Test-Path $exe)) {
            throw "Executável não encontrado: $exe"
          }
          $dll = "dist/NutriLab/_internal/python312.dll"
          $icon = "assets/identidade/nutrilab.ico"
          if (!(Test-Path $dll)) {
            throw "DLL do Python não encontrada: $dll"
          }
          $lms = "dist/NutriLab/_internal/dados/oms_lms_pediatricos.csv"
          if (!(Test-Path $lms)) {
            throw "Tabela LMS oficial OMS não foi empacotada: $lms"
          }
          if ((Get-Item $lms).Length -le 1000) {
            throw "Tabela LMS oficial OMS está vazia ou incompleta: $lms"
          }
          $classificacoes = "dist/NutriLab/_internal/dados/oms_classificacoes_pediatricas.json"
          if (!(Test-Path $classificacoes)) {
            throw "Pontos de corte OMS não foram empacotados: $classificacoes"
          }
          if ((Get-Item $classificacoes).Length -le 100) {
            throw "Metadados OMS estão vazios ou incompletos: $classificacoes"
          }
          $camadas = "dist/NutriLab/_internal/identidade_camadas/folhas.json"
          if (!(Test-Path $camadas)) {
            throw "Camadas transparentes da tela inicial não foram empacotadas: $camadas"
          }
          if (!(Test-Path $icon)) {
            throw "Ícone original não foi gerado: $icon"
          }
          if ((Get-Item $dll).Length -le 0) {
            throw "DLL do Python está vazia: $dll"
          }

      - name: Smoke test — abrir executável e validar servidor mobile
        run: python tools/smoke_test_windows_exe.py dist/NutriLab/NutriLab.exe

      - name: Remover banco gravável criado pelo smoke test
        shell: pwsh
        run: |
          $modelo = "dist/NutriLab/_internal/modelo_banco/clinica.db"
          $bancoUsuario = "dist/NutriLab/clinica.db"
          if (!(Test-Path $modelo)) {
            throw "Banco-modelo interno ausente: $modelo"
          }
          # O smoke test cria o banco gravável ao lado do EXE. Ele NÃO pode ir no ZIP:
          # em uma atualização, o banco do usuário deve permanecer intacto.
          foreach ($arquivo in @($bancoUsuario, "${bancoUsuario}-wal", "${bancoUsuario}-shm", "${bancoUsuario}-journal")) {
            if (Test-Path $arquivo) {
              Remove-Item -LiteralPath $arquivo -Force
            }
          }
          if (Test-Path $bancoUsuario) {
            throw "O banco de runtime ainda seria empacotado: $bancoUsuario"
          }

      - name: Compactar pacote completo
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/NutriLab/*" -DestinationPath "dist/NutriLab-Windows-x64.zip" -Force

      - name: Validar banco único e ausência de caminhos duplicados no ZIP
        run: python tools/verificar_pacote_windows.py dist/NutriLab-Windows-x64.zip

      - name: Publicar artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: NutriLab-Windows-x64
          path: dist/NutriLab-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publicar GitHub Release (somente tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NutriLab-Windows-x64.zip
          generate_release_notes: true
