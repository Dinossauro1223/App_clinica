name: Build Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build NutriLab para Windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Instalar dependências de compilação
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Gerar banco inicial vazio e sanitizado
        run: python tools/gerar_banco_modelo.py

      - name: Compilar NutriLab.exe
        run: python -m PyInstaller --clean --noconfirm app_clinica.spec

      - name: Verificar pacote compilado
        shell: pwsh
        run: |
          $exe = "dist/NutriLab/NutriLab.exe"
          if (!(Test-Path $exe)) {
            throw "Executável não encontrado: $exe"
          }
          if (!(Test-Path "dist/NutriLab/_internal")) {
            throw "Pasta _internal ausente no pacote PyInstaller."
          }

      - name: Compactar pacote completo
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/NutriLab/*" -DestinationPath "dist/NutriLab-Windows-x64.zip" -Force

      - name: Publicar artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: NutriLab-Windows-x64
          path: dist/NutriLab-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publicar GitHub Release (somente tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NutriLab-Windows-x64.zip
          generate_release_notes: true
