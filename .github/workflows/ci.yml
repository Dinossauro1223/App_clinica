name: CI

# Fase 0 (ROADMAP): pipeline de testes automatizados e verificações básicas.
# Não usa segredos nem dados reais. Executa em Windows (alvo do produto) e Linux.

on:
  push:
    branches: [main, "feat/**", "feature/**", "fix/**", "docs/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  testes:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
    steps:
      - name: Baixar o código (histórico completo, para a auditoria)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar o Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar Node.js (testes do modo offline do APK)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testes de conflitos do mapa offline (JavaScript)
        run: node --test tests/test_mobile_offline_conflicts.test.cjs

      - name: Atualizar o pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências fixadas
        run: python -m pip install -r requirements.txt

      - name: Verificar ambiente (versões fixadas, fpdf2, fuso America/Recife)
        run: python tools/verificar_ambiente.py --estrito

      - name: Auditoria de dados sensíveis (arquivos, histórico e .gitignore)
        run: python tools/auditar_repositorio.py --ci

      - name: Testes (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v

      # A tela virtual padrão do xvfb-run é 640x480 com 8 bits de cor; usamos 1360x900 com 24 bits, como um monitor de verdade.
      - name: Testes (Linux, com display virtual para o Tk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          xvfb-run -a -s "-screen 0 1360x900x24" python -m unittest discover -s tests -v

      # Fotos da tela dos gráficos com Tk de verdade (informativo: nunca falha o CI). Servem para conferir a aparência
      # no Windows e no Linux; os dados são sintéticos. Em branches de teste (feat/scratch*) as imagens também vão
      # para o log em base64, para quem não consegue baixar o arquivo.
      - name: Capturar a tela dos gráficos (Windows)
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        run: python tools/capturar_graficos_tk.py capturas ${{ startsWith(github.ref_name, 'feat/scratch') && '--base64' || '' }}

      - name: Capturar a tela dos gráficos (Linux, tela virtual de 24 bits)
        if: always() && runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a -s "-screen 0 1360x900x24" python tools/capturar_graficos_tk.py capturas ${{ startsWith(github.ref_name, 'feat/scratch') && '--base64' || '' }}

      - name: Guardar as fotos da tela
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: capturas-graficos-${{ matrix.os }}
          path: capturas
          if-no-files-found: ignore
          retention-days: 7

  apk-java:
    name: Compilação do código Android
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar plataforma Android 34
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34"

      - name: Baixar ZXing Core
        run: |
          mkdir -p build/apk-libs
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/com/google/zxing/core/3.4.1/core-3.4.1.jar \
            --output build/apk-libs/zxing-core-3.4.1.jar || \
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            https://maven-central.storage-download.googleapis.com/maven2/com/google/zxing/core/3.4.1/core-3.4.1.jar \
            --output build/apk-libs/zxing-core-3.4.1.jar

      - name: Compilar atividades Android
        run: |
          mkdir -p build/apk-classes
          javac -encoding UTF-8 --release 8 \
            -classpath "$ANDROID_HOME/platforms/android-34/android.jar:build/apk-libs/zxing-core-3.4.1.jar" \
            -d build/apk-classes \
            mobile/apk/app/src/br/nutrilab/mobile/MainActivity.java \
            mobile/apk/app/src/br/nutrilab/mobile/QRScannerActivity.java
